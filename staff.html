<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>アンケート配布マップ（スタッフ用）</title>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css">
<style>
  :root{--green:#1f7a4d;--green-d:#155c39;--ink:#1d2421;--sub:#5a635f;--bg:#ffffff;--line:#d9dfdc;--soft:#f3f6f4;
    --todo:#8a948f;--doing:#e0a100;--done:#1f7a4d;--accent:#d94f2b;--me:#2a6fdb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  button,input,textarea{font:inherit;color:inherit}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{flex:none;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:#fff;z-index:1000}
  .hrow{display:flex;align-items:center;gap:8px}
  header h1{margin:0;font-size:16px;line-height:1.3;flex:1}
  .chip{flex:none;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .sum{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .sum b{color:var(--ink);font-size:15px}
  .sum span{display:flex;align-items:center;gap:4px}
  .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex;margin-top:6px}
  .bar i{display:block;height:100%}
  .wrap{position:relative;flex:1;min-height:0;display:flex}
  #map{flex:1;min-height:0;touch-action:none;background:#eef1ef}
  .fab{position:absolute;z-index:1000;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:11px 14px;border:0;border-radius:999px;
    background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}
  .fab svg{width:18px;height:18px}
  #locate{right:12px;bottom:calc(20px + env(safe-area-inset-bottom))}
  #share{right:12px;bottom:calc(74px + env(safe-area-inset-bottom))}
  #share.on{background:var(--me);color:#fff}
  #listBtn{left:12px;bottom:calc(20px + env(safe-area-inset-bottom))}
  #members{left:12px;bottom:calc(74px + env(safe-area-inset-bottom))}
  /* markers */
  .mk{display:flex;align-items:center;cursor:pointer}
  .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex:none;
    background:var(--todo);color:#fff;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pin.doing{background:var(--doing)} .pin.done{background:var(--done)}
  .pin.sel{outline:3px solid var(--accent);outline-offset:1px;transform:scale(1.15)}
  .lbl{display:none;margin-left:4px;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.3);font-size:12px;padding:2px 6px;border-radius:4px;white-space:nowrap}
  .show-lbl .lbl{display:block}
  .person{display:flex;flex-direction:column;align-items:center;pointer-events:auto}
  .person .face{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 5px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.4);
    color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .person .nm{margin-top:3px;background:rgba(29,36,33,.85);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
  .person.stale{opacity:.5}
  /* bottom sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1500;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .2s}
  .sheet.show{transform:none}
  .sh-head{display:flex;align-items:flex-start;gap:8px}
  .sh-head h2{margin:0;font-size:18px;flex:1;line-height:1.4}
  .x{flex:none;background:none;border:0;font-size:26px;line-height:1;padding:0 4px;cursor:pointer;color:var(--sub)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
  .seg button{padding:12px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .seg button[data-s=todo].on{background:var(--todo);border-color:var(--todo);color:#fff}
  .seg button[data-s=doing].on{background:var(--doing);border-color:var(--doing);color:#fff}
  .seg button[data-s=done].on{background:var(--done);border-color:var(--done);color:#fff}
  .fld{display:block;margin-bottom:10px}
  .fld span{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
  .fld input,.fld textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .fld textarea{min-height:64px;resize:vertical}
  .fld.row2{display:flex;gap:8px;align-items:flex-end}
  .fld.row2 input{flex:1}
  .mini{flex:none;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer;white-space:nowrap}
  .meta{font-size:12px;color:var(--sub);margin-top:4px}
  .nav{display:block;text-align:center;font-size:14px;color:var(--green-d);margin-top:8px}
  /* overlays */
  .overlay{position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.show{display:flex}
  .card{background:#fff;border-radius:14px;max-width:460px;width:100%;max-height:90%;overflow:auto;padding:18px;font-size:15px;line-height:1.6}
  .card h2{margin:0 0 8px;font-size:18px}
  .card .primary{width:100%;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;margin-top:10px;cursor:pointer}
  .card .small{font-size:12px;color:var(--sub)}
  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .list li .n{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .list li .t{flex:1;min-width:0}
  .list li .t small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list li .p{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;flex:none}
  .filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .filters button{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2500;background:rgba(29,36,33,.92);color:#fff;
    font-size:14px;padding:9px 14px;border-radius:10px;display:none;max-width:90%}
  .toast.show{display:block}
  .offline{background:#fff4e5;color:#7a4b00;font-size:12px;padding:4px 12px;display:none}
  .offline.show{display:block}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <h1>アンケート配布マップ</h1>
      <button class="chip" id="meBtn"><span class="dot" id="meDot"></span><span id="meName">名前を設定</span></button>
    </div>
    <div class="sum" id="sum"></div>
    <div class="bar" id="bar"></div>
  </header>
  <div class="offline" id="offline">サーバーにつながっていません。電波の良い場所で自動的に再接続します。</div>
  <div class="wrap">
    <div id="map"></div>
    <button class="fab" id="listBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>一覧</button>
    <button class="fab" id="members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span id="memCount">0人</span></button>
    <button class="fab" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="shareTxt">位置を共有</span></button>
    <button class="fab" id="locate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>現在地</button>
    <div class="toast" id="toast"></div>

    <!-- park sheet -->
    <div class="sheet" id="sheet" role="dialog" aria-modal="false">
      <div class="sh-head"><h2 id="shTitle"></h2><button class="x" id="shClose" aria-label="閉じる">×</button></div>
      <div class="seg" id="seg">
        <button data-s="todo">配る前</button><button data-s="doing">配り中</button><button data-s="done">配り済み</button>
      </div>
      <label class="fld"><span>予定配布枚数</span><input id="fPlanned" type="number" inputmode="numeric" min="0" step="1" placeholder="例）40"></label>
      <div class="fld row2">
        <label style="flex:1;min-width:0"><span>配った人</span><input id="fWho" type="text" placeholder="例）田中・佐藤" style="width:100%"></label>
        <button class="mini" id="addMe" type="button">自分を追加</button>
      </div>
      <label class="fld"><span>メモ（配った範囲・残り枚数・不在が多い など）</span><textarea id="fMemo" placeholder="例）東側の住宅から配布。残り10枚。"></textarea></label>
      <div class="meta" id="shMeta"></div>
      <a class="nav" id="shNav" target="_blank" rel="noopener">Googleマップで道順を開く</a>
    </div>

    <!-- name -->
    <div id="nameOv" class="overlay" role="dialog" aria-modal="true">
      <div class="card">
        <h2>あなたの名前</h2>
        <p style="margin:0 0 8px">地図上の表示と「配った人」の記録に使います。</p>
        <label class="fld"><input id="nameIn" type="text" maxlength="20" placeholder="例）田中"></label>
        <button class="primary" id="nameOk">決定</button>
        <p class="small" style="margin-top:10px">位置情報は「位置を共有」を押している間だけ、同じ配布チームのメンバーに見えます。もう一度押すと共有を止め、記録も消えます。</p>
      </div>
    </div>

    <!-- list -->
    <div id="listOv" class="overlay" role="dialog" aria-modal="true">
      <div class="card">
        <div class="sh-head"><h2>公園一覧</h2><button class="x" data-close="listOv" aria-label="閉じる">×</button></div>
        <div class="filters" id="filters">
          <button data-f="all" class="on">すべて</button><button data-f="todo">配る前</button><button data-f="doing">配り中</button><button data-f="done">配り済み</button>
        </div>
        <ul class="list" id="list"></ul>
      </div>
    </div>

    <!-- members -->
    <div id="memOv" class="overlay" role="dialog" aria-modal="true">
      <div class="card">
        <div class="sh-head"><h2>位置を共有中のメンバー</h2><button class="x" data-close="memOv" aria-label="閉じる">×</button></div>
        <ul class="list" id="memList"></ul>
        <p class="small" style="margin-top:10px">名前を押すとその人の場所へ移動します。5分以上更新がない人は薄く、30分以上ない人は表示されません。</p>
      </div>
    </div>

    <!-- setup / error -->
    <div id="setupOv" class="overlay" role="dialog" aria-modal="true">
      <div class="card"><h2 id="setupTitle">準備が必要です</h2><p id="setupMsg" style="margin:0"></p></div>
    </div>
  </div>
</div>

$('nameOk').onclick=()=>{const v=$('nameIn').value.trim();if(!v){$('nameIn').focus();return;}
  myName=v;ls.set('dist_name',v);paintMe();$('nameOv').classList.remove('show');if(sharing)pushLoc(true);};
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('nameOk').click();});
if(!myName)$('nameOv').classList.add('show');

/* ---- map ---- */
mapboxgl.accessToken=MAPBOX_TOKEN;
const bounds=PARKS.reduce((b,p)=>b.extend([p[3],p[2]]),new mapboxgl.LngLatBounds([PARKS[0][3],PARKS[0][2]],[PARKS[0][3],PARKS[0][2]]));
const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v12',language:'ja',
  bounds,fitBoundsOptions:{padding:30},minZoom:9,maxZoom:19,dragRotate:false,pitchWithRotate:false,touchPitch:false});
map.touchZoomRotate.disableRotation();
map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-left');
let fell=false;
map.on('error',e=>{
  if(fell)return;const st=e&&e.error&&e.error.status;if(st!==401&&st!==403&&st!==429)return;fell=true;
  map.setStyle({version:8,sources:{gsi:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'],tileSize:256,maxzoom:18,
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'}},
    layers:[{id:'gsi',type:'raster',source:'gsi'}]});
});
function updateLabels(){$('map').classList.toggle('show-lbl',map.getZoom()>=15);}
map.on('zoomend',updateLabels);map.on('load',updateLabels);

/* ---- park state ---- */
const state={};   // no -> {status,planned,who,memo,updatedName,updatedAt}
const pins={};
PARKS.forEach(([no,name,lat,lng])=>{
  state[no]={status:'todo',planned:null,who:'',memo:''};
  const el=document.createElement('div');el.className='mk';
  el.innerHTML='<div class="pin">'+Number(no)+'</div><div class="lbl"></div>';el.lastChild.textContent=name;
  el.addEventListener('click',e=>{e.stopPropagation();openSheet(no);});
  new mapboxgl.Marker({element:el,anchor:'left',offset:[-15,0]}).setLngLat([lng,lat]).addTo(map);
  pins[no]=el.firstChild;
});
const parkOf=no=>PARKS.find(p=>p[0]===no);
function paintPin(no){const p=pins[no];p.classList.remove('doing','done');const s=state[no].status;if(s!=='todo')p.classList.add(s);}

function paintSummary(){
  const c={todo:0,doing:0,done:0},pl={todo:0,doing:0,done:0};let total=0;
  for(const no in state){const s=state[no];c[s.status]++;const n=Number(s.planned)||0;pl[s.status]+=n;total+=n;}
  $('sum').innerHTML=
    ['todo','doing','done'].map(k=>'<span><i class="dot" style="background:'+COL[k]+'"></i>'+ST[k]+' <b>'+c[k]+'</b></span>').join('')+
    '<span>予定 <b>'+total+'</b>枚（済 '+pl.done+'）</span>';
  const n=PARKS.length;
  $('bar').innerHTML=['done','doing','todo'].map(k=>'<i style="width:'+(c[k]/n*100)+'%;background:'+COL[k]+'"></i>').join('');
}
paintSummary();

/* ---- sheet ---- */
let cur=null;
function fmtTime(ms){if(!ms)return'';const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function fillSheet(force){
  if(!cur)return;const s=state[cur],[no,name,lat,lng]=parkOf(cur);
  $('shTitle').textContent=Number(no)+'．'+name;
  [...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s.status));
  const a=document.activeElement;
  if(force||a!==$('fPlanned'))$('fPlanned').value=s.planned??'';
  if(force||a!==$('fWho'))$('fWho').value=s.who||'';
  if(force||a!==$('fMemo'))$('fMemo').value=s.memo||'';
  $('shMeta').textContent=s.updatedAt?'最終更新：'+(s.updatedName||'不明')+'（'+fmtTime(s.updatedAt)+'）':'まだ記録がありません';
  $('shNav').href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
}
function openSheet(no){
  if(cur&&pins[cur])pins[cur].classList.remove('sel');
  cur=no;pins[no].classList.add('sel');fillSheet(true);$('sheet').classList.add('show');
  const p=parkOf(no);map.easeTo({center:[p[3],p[2]],offset:[0,-120],zoom:Math.max(map.getZoom(),15)});
}
function closeSheet(){$('sheet').classList.remove('show');if(cur&&pins[cur])pins[cur].classList.remove('sel');cur=null;document.activeElement&&document.activeElement.blur();}
$('shClose').onclick=closeSheet;
map.on('click',closeSheet);

/* ---- sync with Google Sheets (Apps Script) ---- */
let online=false,setupErr=false;
const pending={};   // no -> number of writes in flight (skip server values meanwhile)
function ready(){return online;}
async function apiGet(){
  const r=await fetch(GAS_URL+'?action=state&k='+encodeURIComponent(TEAM)+'&_='+Date.now(),{cache:'no-store'});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function apiPost(body){
  body.k=TEAM;
  const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
let peopleAt=Date.now();
function applyState(j){
  j.parks.forEach(d=>{
    const no=d.no;if(!state[no]||pending[no])return;
    state[no]={status:d.status||'todo',planned:d.planned,who:d.who||'',memo:d.memo||'',updatedName:d.updatedName||'',updatedAt:d.updatedAt||0};
    paintPin(no);
  });
  paintSummary();if(cur)fillSheet(false);if($('listOv').classList.contains('show'))renderList();
  for(const k in people)delete people[k];
  peopleAt=Date.now();(j.members||[]).forEach(m=>{people[m.id]=m;});
  paintPeople();
}
function handleErr(e){
  console.error(e);
  if(e&&e.message==='bad_key'){setupErr=true;showSetup('リンクが正しくありません','URL末尾の <b>?k=…</b> がスプレッドシート側の合言葉と一致していません。管理者に正しいリンクをもらってください。');return;}
  online=false;$('offline').classList.add('show');
}
let polling=false;
async function refresh(){
  if(setupErr||polling)return;polling=true;
  try{const j=await apiGet();online=true;$('offline').classList.remove('show');applyState(j);}
  catch(e){handleErr(e);}
  finally{polling=false;}
}
async function save(no,patch,msg){
  Object.assign(state[no],patch,{updatedName:myName||'名無し',updatedAt:Date.now()});paintPin(no);paintSummary();
  pending[no]=(pending[no]||0)+1;
  try{
    const j=await apiPost({action:'park',no,patch,name:myName||'名無し'});
    pending[no]--;if(!pending[no])delete pending[no];
    online=true;$('offline').classList.remove('show');applyState(j);
    if(msg)say(msg);
  }catch(e){pending[no]--;if(!pending[no])delete pending[no];handleErr(e);say('保存できませんでした。通信状況を確認して、もう一度押してください',3500);}
}
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!cur)return;
  const s=b.dataset.s;const patch={status:s};
  if(s!=='todo'&&myName&&!(state[cur].who||'').includes(myName)){patch.who=(state[cur].who?state[cur].who+'・':'')+myName;}
  save(cur,patch,ST[s]+'にしました');fillSheet(true);});
$('fPlanned').addEventListener('change',()=>{if(!cur)return;const v=$('fPlanned').value.trim();save(cur,{planned:v===''?null:Math.max(0,Math.round(Number(v)))},'予定枚数を保存しました');});
$('fWho').addEventListener('change',()=>{if(cur)save(cur,{who:$('fWho').value.trim()},'配った人を保存しました');});
$('fMemo').addEventListener('change',()=>{if(cur)save(cur,{memo:$('fMemo').value.trim()},'メモを保存しました');});
$('addMe').onclick=()=>{if(!cur)return;if(!myName){$('meBtn').click();return;}
  const w=state[cur].who||'';if(w.split(/[・、,\s]+/).includes(myName)){say('すでに入っています');return;}
  const v=(w?w+'・':'')+myName;$('fWho').value=v;save(cur,{who:v},'配った人に追加しました');};

function startSync(){
  if(!TEAM||TEAM.length<12){setupErr=true;showSetup('配布チーム用のリンクから開いてください','このページは、末尾に <b>?k=…</b> が付いた配布チーム用のURLから開く必要があります。管理者にリンクをもらってください。');return;}
  if(!/^https:\/\/script\.google\.com\//.test(GAS_URL)){setupErr=true;showSetup('スプレッドシートとの接続設定が必要です','HTMLファイル上部の <b>GAS_URL</b> に、Apps Script のウェブアプリURLを貼り付けてください。');return;}
  refresh();
  setInterval(()=>{if(document.visibilityState==='visible')refresh();},POLL_SEC*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
}
window.addEventListener('online',refresh);
window.addEventListener('offline',()=>$('offline').classList.add('show'));

/* ---- people (real-time location) ---- */
const people={};const pMarkers={};
function age(p){return (Number(p.age)||0)+(Date.now()-peopleAt);}
function paintPeople(){
  let n=0;
  for(const id in pMarkers){if(!people[id]||age(people[id])>30*60e3){pMarkers[id].remove();delete pMarkers[id];}}
  for(const id in people){
    const p=people[id];if(id===myId||typeof p.lat!=='number'||age(p)>30*60e3)continue;n++;
    let m=pMarkers[id];
    if(!m){const el=document.createElement('div');el.className='person';el.innerHTML='<div class="face"></div><div class="nm"></div>';
      m=pMarkers[id]=new mapboxgl.Marker({element:el,anchor:'top',offset:[0,-16]}).setLngLat([p.lng,p.lat]).addTo(map);}
    const el=m.getElement(),nm=String(p.name||'?');
    el.querySelector('.face').style.background=colorOf(nm);el.querySelector('.face').textContent=nm.slice(0,1);
    el.querySelector('.nm').textContent=nm+(age(p)>5*60e3?'（'+Math.round(age(p)/60e3)+'分前）':'');
    el.classList.toggle('stale',age(p)>5*60e3);m.setLngLat([p.lng,p.lat]);
  }
  $('memCount').textContent=(n+(sharing?1:0))+'人';
  if($('memOv').classList.contains('show'))renderMembers();
}
setInterval(paintPeople,30e3);
function renderMembers(){
  const ul=$('memList');ul.innerHTML='';
  const arr=Object.entries(people).filter(([id,p])=>typeof p.lat==='number'&&(id===myId?sharing:age(p)<=30*60e3)).sort((a,b)=>age(a[1])-age(b[1]));
  if(!arr.length){ul.innerHTML='<li style="cursor:default;color:var(--sub)">今は誰も位置を共有していません</li>';return;}
  arr.forEach(([id,p])=>{const li=document.createElement('li');const nm=String(p.name||'?');
    li.innerHTML='<span class="n"></span><span class="t"></span><span class="p"></span>';
    li.querySelector('.n').style.background=colorOf(nm);li.querySelector('.n').textContent=nm.slice(0,1);
    li.querySelector('.t').textContent=nm+(id===myId?'（自分）':'');
    const a=age(p);li.querySelector('.p').textContent=a<60e3?'たった今':Math.round(a/60e3)+'分前';
    li.onclick=()=>{$('memOv').classList.remove('show');map.flyTo({center:[p.lng,p.lat],zoom:16});};ul.appendChild(li);});
}
$('members').onclick=()=>{renderMembers();$('memOv').classList.add('show');};

let sharing=false,watchId=null,last=null,lastSent=0,meMarker=null,wake=null;
function dist(a,b){const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function showMeAt(ll){if(!meMarker){const d=document.createElement('div');d.style.cssText='width:18px;height:18px;border-radius:50%;background:#2a6fdb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,111,219,.2)';
  meMarker=new mapboxgl.Marker({element:d}).setLngLat(ll).addTo(map);}else meMarker.setLngLat(ll);}
let lastSentPos=null;
async function pushLoc(force){
  if(!sharing||!last||!ready())return;
  const now=Date.now();
  if(!force&&lastSentPos&&(now-lastSent<30e3||dist(lastSentPos,last)<30)&&now-lastSent<60e3)return;
  lastSent=now;lastSentPos=last;
  try{const j=await apiPost({action:'loc',id:myId,name:myName||'名無し',lat:last.lat,lng:last.lng,acc:last.acc});applyState(j);}catch(e){console.error(e);}
}
function onPos(p){last={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};showMeAt([last.lng,last.lat]);pushLoc(false);}
async function startShare(){
  if(!myName){$('meBtn').click();return;}
  if(!navigator.geolocation||!window.isSecureContext){say('この端末では位置情報が使えません');return;}
  if(!ready()){say('まだサーバーに接続していません');return;}
  sharing=true;$('share').classList.add('on');$('shareTxt').textContent='共有中（止める）';
  watchId=navigator.geolocation.watchPosition(onPos,e=>{
    if(e.code===1){say('位置情報の利用が許可されていません',3500);stopShare();}
  },{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
  try{wake=await navigator.wakeLock.request('screen');}catch(e){}
  say('位置の共有を始めました');paintPeople();
}
async function stopShare(){
  sharing=false;$('share').classList.remove('on');$('shareTxt').textContent='位置を共有';
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
  try{wake&&wake.release();}catch(e){}wake=null;
  lastSentPos=null;
  try{const j=await apiPost({action:'leave',id:myId});applyState(j);}catch(e){console.error(e);}
  paintPeople();
}
$('share').onclick=()=>sharing?stopShare():startShare();
// keep heartbeat while open; re-acquire wake lock on return
setInterval(()=>{if(sharing&&last)pushLoc(false);},20e3);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&sharing){try{wake=await navigator.wakeLock.request('screen');}catch(e){}pushLoc(true);}
});

$('locate').onclick=()=>{
  if(last){map.flyTo({center:[last.lng,last.lat],zoom:16});return;}
  if(!navigator.geolocation||!window.isSecureContext){say('位置情報がオフになっています');return;}
  say('現在地を確認しています…',8000);
  navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.longitude,p.coords.latitude];showMeAt(ll);map.flyTo({center:ll,zoom:16});$('toast').classList.remove('show');},
    ()=>say('位置情報がオフになっています'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
};

/* ---- list ---- */
let filter='all';
function renderList(){
  const ul=$('list');ul.innerHTML='';
  PARKS.filter(p=>filter==='all'||state[p[0]].status===filter).forEach(([no,name])=>{
    const s=state[no];const li=document.createElement('li');
    li.innerHTML='<span class="n"></span><span class="t"><span></span><small></small></span><span class="p"></span>';
    li.querySelector('.n').style.background=COL[s.status];li.querySelector('.n').textContent=Number(no);
    li.querySelector('.t span').textContent=name;
    li.querySelector('.t small').textContent=[ST[s.status],s.who,s.memo].filter(Boolean).join('｜');
    li.querySelector('.p').textContent=s.planned!=null&&s.planned!==''?s.planned+'枚':'';
    li.onclick=()=>{$('listOv').classList.remove('show');openSheet(no);};ul.appendChild(li);
  });
  if(!ul.children.length)ul.innerHTML='<li style="cursor:default;color:var(--sub)">該当する公園はありません</li>';
}
$('listBtn').onclick=()=>{renderList();$('listOv').classList.add('show');};
$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  [...$('filters').children].forEach(x=>x.classList.toggle('on',x===b));renderList();});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));
['listOv','memOv'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)$(id).classList.remove('show');}));

// block page-level pinch zoom (iOS Safari)
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&!e.target.closest('#map'))e.preventDefault();},{passive:false});

startSync();
</script>
</body>
</html>
